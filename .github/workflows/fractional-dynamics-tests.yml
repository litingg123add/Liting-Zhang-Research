name: Fractional Dynamics tests

on:
  push:
    paths:
      - "projects/Fractional-Dynamics-AI/**"
      - ".github/workflows/fractional-dynamics-tests.yml"
  pull_request:
    paths:
      - "projects/Fractional-Dynamics-AI/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/Fractional-Dynamics-AI

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run numerical tests
        run: pytest -q
